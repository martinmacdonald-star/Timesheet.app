<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timesheet">
<meta name="theme-color" content="#1B2027">
<title>Daily Timesheet</title>
<style>
  :root{
    --ink:#1B2027;
    --steel:#3A4552;
    --paper:#F3F1EC;
    --card:#FFFFFF;
    --line:#DEDAD0;
    --amber:#E8912B;
    --amber-dark:#C6791D;
    --good:#3C7A5D;
    --bad:#B24A3C;
    --muted:#767065;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
  }
  header.top{
    background:var(--ink); color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 20px 18px;
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--amber);
  }
  header.top .row{display:flex; align-items:baseline; justify-content:space-between;}
  header.top h1{margin:0; font-size:19px; font-weight:700; letter-spacing:0.2px;}
  header.top .datebadge{font-size:13px; color:#C9CDD3; font-variant-numeric:tabular-nums;}
  main{padding:16px; max-width:560px; margin:0 auto;}
  section.card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:14px;
  }
  section.card h2{
    margin:0 0 12px; font-size:13px; font-weight:700; color:var(--steel);
    text-transform:uppercase; letter-spacing:0.6px;
  }
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], textarea{
    width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line);
    border-radius:9px; background:#FBFAF7; color:var(--ink); font-family:inherit;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--amber); background:#fff;}
  textarea{resize:vertical; min-height:56px; line-height:1.4;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 88px; gap:10px; align-items:end;}
  .hours-readout{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:#fff; border-radius:9px; padding:14px 16px; margin-top:12px;
  }
  .hours-readout .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
  .hours-readout .lbl{font-size:12px; color:#C9CDD3; text-transform:uppercase; letter-spacing:0.5px;}
  .job-row{
    border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#FBFAF7;
  }
  .job-row .top-line{display:flex; gap:10px; margin-bottom:8px;}
  .job-row .top-line input[type=text]{flex:1;}
  .job-row .top-line input[type=number]{width:78px;}
  .removejob{
    border:none; background:none; color:var(--bad); font-size:13px; font-weight:600;
    padding:8px 0 0; text-align:right; width:100%; cursor:pointer;
  }
  button.addjob{
    width:100%; padding:12px; border-radius:9px; border:1.5px dashed var(--steel);
    background:transparent; color:var(--steel); font-size:14px; font-weight:600; cursor:pointer;
  }
  .btnrow{display:flex; gap:10px; margin-top:4px;}
  button.primary, button.secondary{
    flex:1; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; -webkit-appearance:none;
  }
  button.primary{background:var(--amber); color:#1B2027;}
  button.primary:active{background:var(--amber-dark);}
  button.secondary{background:var(--ink); color:#fff;}
  button.secondary:active{background:#000;}
  button.linklike{background:none; border:none; color:var(--steel); font-size:13px; font-weight:600; padding:6px 0; cursor:pointer;}
  .settings-toggle{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .settings-toggle .chev{transition:transform .15s ease; color:var(--muted);}
  .settings-toggle.open .chev{transform:rotate(90deg);}
  .settings-body{display:none; margin-top:6px;}
  .settings-body.show{display:block;}
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .d{font-weight:600;}
  .history-item .h{color:var(--muted); font-size:13px;}
  .history-item .acts button{border:none; background:none; font-size:13px; font-weight:600; padding:4px 6px; cursor:pointer;}
  .history-item .acts .ld{color:var(--steel);}
  .history-item .acts .dl{color:var(--bad);}
  .empty{color:var(--muted); font-size:13px; padding:6px 2px;}
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:13px 16px; border-radius:10px; font-size:14px;
    text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0; transform:translateY(8px); transition:opacity .2s ease, transform .2s ease;
    pointer-events:none; z-index:50; max-width:560px; margin:0 auto;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.4;}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <h1>Daily Timesheet</h1>
    <div class="datebadge" id="headerDate">–</div>
  </div>
</header>

<main>

  <section class="card">
    <div class="settings-toggle" id="settingsToggle">
      <h2 style="margin:0;">Your details &amp; send-to address</h2>
      <span class="chev">›</span>
    </div>
    <div class="settings-body" id="settingsBody">
      <label for="employeeName">Your name</label>
      <input type="text" id="employeeName" placeholder="e.g. J. Carter">

      <label for="recipientEmail">Send timesheet to</label>
      <input type="email" id="recipientEmail" placeholder="timesheets@bryantbuilding.com.au">
      <p class="hint">Saved on this device. Tap "Email timesheet" below to open Mail with these details filled in — you just hit send.</p>
    </div>
  </section>

  <section class="card">
    <h2>Date &amp; hours</h2>
    <label for="entryDate">Date</label>
    <input type="date" id="entryDate">

    <div class="grid2">
      <div>
        <label for="startTime">Start</label>
        <input type="time" id="startTime" value="06:30">
      </div>
      <div>
        <label for="finishTime">Finish</label>
        <input type="time" id="finishTime" value="15:00">
      </div>
    </div>
    <label for="breakMins">Break (minutes)</label>
    <input type="number" id="breakMins" value="30" min="0" step="5" inputmode="numeric">

    <div class="hours-readout">
      <span class="lbl">Total hours</span>
      <span class="num" id="totalHours">0.00</span>
    </div>
  </section>

  <section class="card">
    <h2>Jobs worked today</h2>
    <div id="jobList"></div>
    <button class="addjob" id="addJobBtn" type="button">+ Add job / site</button>
  </section>

  <section class="card">
    <h2>Actions</h2>
    <div class="btnrow">
      <button class="secondary" id="saveBtn" type="button">Save entry</button>
      <button class="primary" id="emailBtn" type="button">Email timesheet</button>
    </div>
    <p class="hint" id="saveStatus"></p>
  </section>

  <section class="card">
    <h2>Recent entries</h2>
    <div id="historyList"><p class="empty">No saved entries yet.</p></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);

  const employeeName = $('employeeName');
  const recipientEmail = $('recipientEmail');
  const entryDate = $('entryDate');
  const startTime = $('startTime');
  const finishTime = $('finishTime');
  const breakMins = $('breakMins');
  const totalHoursEl = $('totalHours');
  const jobList = $('jobList');
  const headerDate = $('headerDate');
  const toast = $('toast');
  const saveStatus = $('saveStatus');
  const historyList = $('historyList');

  let jobRowSeq = 0;

  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off*60000);
    return local.toISOString().slice(0,10);
  }

  function fmtDateReadable(iso){
    if(!iso) return '–';
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  function calcHours(){
    const [sh, sm] = startTime.value.split(':').map(Number);
    const [fh, fm] = finishTime.value.split(':').map(Number);
    if(isNaN(sh) || isNaN(fh)){ totalHoursEl.textContent = '0.00'; return 0; }
    let startMinutes = sh*60 + sm;
    let finishMinutes = fh*60 + fm;
    if(finishMinutes < startMinutes) finishMinutes += 24*60; // overnight shift safeguard
    const brk = Number(breakMins.value) || 0;
    let total = (finishMinutes - startMinutes - brk) / 60;
    if(total < 0) total = 0;
    totalHoursEl.textContent = total.toFixed(2);
    return total;
  }

  function addJobRow(job){
    job = job || {name:'', hours:'', notes:''};
    const id = 'job_' + (jobRowSeq++);
    const row = document.createElement('div');
    row.className = 'job-row';
    row.dataset.rowId = id;
    row.innerHTML = `
      <div class="top-line">
        <input type="text" class="jobName" placeholder="Job / site name" value="${escapeAttr(job.name)}">
        <input type="number" class="jobHours" placeholder="Hrs" min="0" step="0.25" inputmode="decimal" value="${escapeAttr(job.hours)}">
      </div>
      <textarea class="jobNotes" placeholder="What was done on this job today...">${escapeHtml(job.notes)}</textarea>
      <button type="button" class="removejob">Remove</button>
    `;
    row.querySelector('.removejob').addEventListener('click', ()=>{
      row.remove();
      maybeShowEmptyJobHint();
    });
    jobList.appendChild(row);
    maybeShowEmptyJobHint();
  }

  function maybeShowEmptyJobHint(){
    // no-op placeholder kept for future hint logic
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  function escapeAttr(s){
    return (s===undefined || s===null) ? '' : String(s).replace(/"/g,'&quot;');
  }

  function collectJobs(){
    return Array.from(jobList.querySelectorAll('.job-row')).map(row=>({
      name: row.querySelector('.jobName').value.trim(),
      hours: row.querySelector('.jobHours').value.trim(),
      notes: row.querySelector('.jobNotes').value.trim()
    })).filter(j => j.name || j.hours || j.notes);
  }

  function buildEntry(){
    return {
      date: entryDate.value,
      employeeName: employeeName.value.trim(),
      startTime: startTime.value,
      finishTime: finishTime.value,
      breakMins: Number(breakMins.value)||0,
      totalHours: calcHours(),
      jobs: collectJobs(),
      savedAt: new Date().toISOString()
    };
  }

  function entryToEmailBody(entry){
    const lines = [];
    lines.push(`Timesheet — ${fmtDateReadable(entry.date)}`);
    lines.push(`Name: ${entry.employeeName || '(not set)'}`);
    lines.push('');
    lines.push(`Start: ${entry.startTime}   Finish: ${entry.finishTime}   Break: ${entry.breakMins} min`);
    lines.push(`Total hours: ${entry.totalHours.toFixed(2)}`);
    lines.push('');
    lines.push('Jobs worked today:');
    if(entry.jobs.length === 0){
      lines.push('  (none entered)');
    } else {
      entry.jobs.forEach(j=>{
        lines.push(`- ${j.name || '(unnamed job)'}${j.hours ? ' — ' + j.hours + ' hrs' : ''}`);
        if(j.notes) lines.push(`    ${j.notes}`);
      });
    }
    return lines.join('\n');
  }

  function loadSettings(){
    try{
      const name = localStorage.getItem('ts_settings_employeeName');
      if(name) employeeName.value = name;
      const email = localStorage.getItem('ts_settings_recipientEmail');
      if(email) recipientEmail.value = email;
    }catch(e){}
  }

  function saveSettings(){
    try{
      localStorage.setItem('ts_settings_employeeName', employeeName.value.trim());
      localStorage.setItem('ts_settings_recipientEmail', recipientEmail.value.trim());
    }catch(e){}
  }

  function saveEntry(silent){
    const entry = buildEntry();
    if(!entry.date){
      showToast('Set a date first');
      return null;
    }
    try{
      localStorage.setItem('ts_entry_' + entry.date, JSON.stringify(entry));
      saveSettings();
      if(!silent){
        showToast('Entry saved for ' + fmtDateReadable(entry.date));
        saveStatus.textContent = 'Saved ' + new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'});
      }
      refreshHistory();
      return entry;
    }catch(e){
      showToast('Could not save — check Safari storage isn\'t blocked (Private Browsing prevents saving)');
      return entry; // still allow email to proceed even if save failed
    }
  }

  function refreshHistory(){
    try{
      const keys = Object.keys(localStorage).filter(k => k.startsWith('ts_entry_'));
      if(keys.length === 0){
        historyList.innerHTML = '<p class="empty">No saved entries yet.</p>';
        return;
      }
      keys.sort().reverse();
      const shown = keys.slice(0, 10);
      const rows = shown.map(k=>{
        try{
          const e = JSON.parse(localStorage.getItem(k));
          return `
            <div class="history-item" data-key="${k}">
              <div>
                <div class="d">${fmtDateReadable(e.date)}</div>
                <div class="h">${e.totalHours.toFixed(2)} hrs · ${e.jobs.length} job${e.jobs.length===1?'':'s'}</div>
              </div>
              <div class="acts">
                <button class="ld" data-action="load">Load</button>
                <button class="dl" data-action="delete">Delete</button>
              </div>
            </div>`;
        }catch(err){ return ''; }
      });
      historyList.innerHTML = rows.join('') || '<p class="empty">No saved entries yet.</p>';
      historyList.querySelectorAll('.history-item').forEach(item=>{
        const key = item.dataset.key;
        item.querySelector('[data-action="load"]').addEventListener('click', ()=>loadEntry(key));
        item.querySelector('[data-action="delete"]').addEventListener('click', ()=>deleteEntry(key));
      });
    }catch(e){
      historyList.innerHTML = '<p class="empty">No saved entries yet.</p>';
    }
  }

  function loadEntry(key){
    try{
      const e = JSON.parse(localStorage.getItem(key));
      entryDate.value = e.date;
      startTime.value = e.startTime;
      finishTime.value = e.finishTime;
      breakMins.value = e.breakMins;
      jobList.innerHTML = '';
      if(e.jobs && e.jobs.length){
        e.jobs.forEach(addJobRow);
      } else {
        addJobRow();
      }
      calcHours();
      headerDate.textContent = fmtDateReadable(e.date);
      showToast('Loaded ' + fmtDateReadable(e.date));
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){
      showToast('Could not load that entry');
    }
  }

  function deleteEntry(key){
    try{
      localStorage.removeItem(key);
      showToast('Entry deleted');
      refreshHistory();
    }catch(e){
      showToast('Could not delete — try again');
    }
  }

  function emailTimesheet(){
    const entry = saveEntry(true);
    if(!entry) return;
    const to = recipientEmail.value.trim();
    if(!to){
      showToast('Add a send-to email address above first');
      $('settingsBody').classList.add('show');
      $('settingsToggle').classList.add('open');
      recipientEmail.focus();
      return;
    }
    const subject = `Timesheet - ${entry.employeeName || 'Employee'} - ${entry.date}`;
    const body = entryToEmailBody(entry);
    const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
    saveStatus.textContent = 'Opening Mail…';
  }

  // Settings collapse toggle
  $('settingsToggle').addEventListener('click', ()=>{
    $('settingsBody').classList.toggle('show');
    $('settingsToggle').classList.toggle('open');
  });

  $('addJobBtn').addEventListener('click', ()=>addJobRow());
  $('saveBtn').addEventListener('click', ()=>saveEntry(false));
  $('emailBtn').addEventListener('click', ()=>emailTimesheet());

  [startTime, finishTime, breakMins].forEach(el=>{
    el.addEventListener('input', calcHours);
    el.addEventListener('change', calcHours);
  });

  entryDate.addEventListener('change', ()=>{
    headerDate.textContent = fmtDateReadable(entryDate.value);
  });

  // Init
  entryDate.value = todayISO();
  headerDate.textContent = fmtDateReadable(entryDate.value);
  addJobRow();
  calcHours();
  loadSettings();
  refreshHistory();

})();
</script>
</body>
</html>
